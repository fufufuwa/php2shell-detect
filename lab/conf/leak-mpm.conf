# php2shell-detect lab — single-worker prefork + /leak per-dir memory limit.
# A single persistent worker is the precondition for cross-request state reuse.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    ServerLimit 1
    MaxConnectionsPerChild 0
</IfModule>
Alias /leak /var/www/html/index.php
<Location "/leak">
    php_value memory_limit 8M
</Location>
